<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>水 Bar · 清吧与啤酒吧地图</title>
<meta name="description" content="清吧与啤酒吧的营业时间、位置和导航，一站查看。">
<meta property="og:type" content="website">
<meta property="og:title" content="水 Bar · 清吧与啤酒吧地图">
<meta property="og:description" content="清吧与啤酒吧的营业时间、位置和导航，一站查看。">
<meta property="og:url" content="https://staleegin.github.io/xinxiangbarweb/">
<meta property="og:image" content="https://staleegin.github.io/xinxiangbarweb/share.jpg">
<meta itemprop="image" content="https://staleegin.github.io/xinxiangbarweb/share.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="hero" id="hero" hidden></section>
<header class="top" id="top">
  <div class="row">
    <h1 id="ttl">水 Bar</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="chips" id="chips" role="group" aria-label="筛选"></div>
</header>

<div class="mapwrap" id="mapwrap" hidden>
  <div class="orb" id="orb">
    <svg class="dirs" id="dirs" viewBox="0 0 300 300" aria-hidden="true"></svg>
    <div class="map" id="amap"></div>
    <button class="orb-hit" id="orbhit" aria-label="放大地图"></button>
    <button class="orb-x" id="orbx" aria-label="收起地图"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
  <p class="note" id="maperr" role="status"></p>
  <div class="mbar"><div class="chips" id="mchips" role="group" aria-label="筛选"></div><p class="sub" id="msub"></p></div>
</div>

<main id="view"></main>

<nav class="dock" id="dock">
  <div class="tabs" id="tabs">
    <button data-tab="discover" aria-current="page" aria-label="推荐"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14l-7 8z"/><path d="M12 13v6M8.5 19h7"/></svg><span class="lbl">推荐</span></button>
    <button data-tab="map" aria-label="地图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.500-5.400-6.500-10.500a6.500 6.500 0 1 1 13 0C18.500 15.600 12 21 12 21z"/><circle cx="12" cy="10.500" r="2.300"/></svg><span class="lbl">地图</span></button>
    <button data-tab="fav" aria-label="收藏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-8-4.9-8-10.6A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 8 2.4C20 15.100 12 20 12 20z"/></svg><span class="lbl">收藏</span><i id="favn"></i></button>
  </div>
  <label class="sfield" id="sfield">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 4 4"/></svg>
    <input id="q" type="search" placeholder="搜店名、地址、区域" autocomplete="off" enterkeyhint="search" aria-label="搜索酒吧" tabindex="-1">
  </label>
  <button class="sbtn" id="sbtn" aria-label="搜索" aria-expanded="false"><svg class="i-s" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 4 4"/></svg><svg class="i-x" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
</nav>

<div class="wrap" id="wrap">
  <div class="scrim" data-close></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="详情"></section>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
