<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0ec">
<title>Bar Atlas 新乡酒吧地图</title>
<meta name="description" content="新乡本地酒吧、酒单与价格，一站查看。">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="row">
    <h1>Bar Atlas <span>新乡</span></h1>
    <button class="ghost" id="join">商家入驻</button>
  </div>
  <label class="search">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 4 4"/></svg>
    <input id="q" type="search" placeholder="搜酒吧、酒名、区域" autocomplete="off" enterkeyhint="search">
  </label>
  <div class="chips" id="chips" role="group" aria-label="筛选"></div>
</header>

<div class="mapwrap" id="mapwrap" hidden>
  <div class="map" id="amap"></div>
  <p class="note">示例酒吧没有真实位置，不显示在地图上。</p>
  <p class="note" id="maperr" role="status"></p>
</div>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="discover" aria-current="page">发现</button>
  <button data-tab="fav">收藏 <i id="favn"></i></button>
  <button data-tab="map">地图</button>
</nav>

<div class="wrap" id="wrap">
  <div class="scrim" data-close></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="详情"></section>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
